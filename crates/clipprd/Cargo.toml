[package]
name = "clipprd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clipprd"
path = "src/main.rs"

[dependencies]
clippr-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-app = { version = "0.25", features = ["v1_24"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "global_shortcuts"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "signal", "sync", "time", "process", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }

pipewire = "0.10"

tempfile = "3"
