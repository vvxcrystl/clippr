[workspace]
resolver = "2"
members = ["crates/clippr-core", "crates/clipprd", "crates/clippr-cli", "crates/clippr-gui", "crates/clippr-toast"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clippr-core = { path = "crates/clippr-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
